<div
	style="
		display: flex;
		flex-direction: column;
		align-items: center;
		background: #0f172a;
		padding: 20px;
		border-radius: 12px;
	"
>
	<div
		style="
			color: #06b6d4;
			font-family: monospace;
			margin-bottom: 10px;
			font-size: 20px;
		"
	>
		SCORE: <span id="score">0</span>
	</div>
	<canvas
		id="snakeGame"
		width="400"
		height="400"
		style="border: 2px solid #06b6d4; background: #000"
	></canvas>
	<div style="color: #64748b; margin-top: 10px; font-size: 14px">
		방향키(Arrow Keys)로 조작하세요
	</div>
</div>

<script>
	const canvas = document.getElementById("snakeGame");
	const ctx = canvas.getContext("2d");
	const scoreElement = document.getElementById("score");

	const box = 20; // 그리드 한 칸의 크기
	let score = 0;
	let gameSpeed = 100; // 게임 속도 (ms)

	// 뱀 초기 설정 (중앙 배치)
	let snake = [{ x: 9 * box, y: 10 * box }];

	// 먹이 초기 설정
	let food = {
		x: Math.floor(Math.random() * 19 + 1) * box,
		y: Math.floor(Math.random() * 19 + 1) * box,
	};

	let d; // 방향 변수

	document.addEventListener("keydown", direction);

	function direction(event) {
		if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
		else if (event.keyCode == 38 && d != "DOWN") d = "UP";
		else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
		else if (event.keyCode == 40 && d != "UP") d = "DOWN";
	}

	function draw() {
		// 배경 칠하기
		ctx.fillStyle = "black";
		ctx.fillRect(0, 0, canvas.width, canvas.height);

		// 뱀 그리기
		for (let i = 0; i < snake.length; i++) {
			ctx.fillStyle = i == 0 ? "#06b6d4" : "#0891b2"; // 머리는 밝은 블루, 몸통은 조금 어두운 블루
			ctx.strokeStyle = "#000";
			ctx.fillRect(snake[i].x, snake[i].y, box, box);
			ctx.strokeRect(snake[i].x, snake[i].y, box, box);
		}

		// 먹이 그리기 (코드 기호 모양 느낌으로)
		ctx.fillStyle = "#fbbf24"; // 노란색 포인트
		ctx.font = "15px Arial";
		ctx.fillText("< >", food.x + 2, food.y + 15);

		// 현재 머리 위치
		let snakeX = snake[0].x;
		let snakeY = snake[0].y;

		// 방향에 따른 이동
		if (d == "LEFT") snakeX -= box;
		if (d == "UP") snakeY -= box;
		if (d == "RIGHT") snakeX += box;
		if (d == "DOWN") snakeY += box;

		// 먹이를 먹었을 때
		if (snakeX == food.x && snakeY == food.y) {
			score++;
			scoreElement.innerHTML = score;
			food = {
				x: Math.floor(Math.random() * 19 + 1) * box,
				y: Math.floor(Math.random() * 19 + 1) * box,
			};
		} else {
			// 먹이를 안 먹었으면 꼬리 제거
			snake.pop();
		}

		let newHead = { x: snakeX, y: snakeY };

		// 게임 오버 조건 (벽 충돌 또는 자기 몸 충돌)
		if (
			snakeX < 0 ||
			snakeX >= canvas.width ||
			snakeY < 0 ||
			snakeY >= canvas.height ||
			collision(newHead, snake)
		) {
			clearInterval(game);
			alert("GAME OVER! 최종 점수: " + score);
			location.reload(); // 페이지 새로고침으로 재시작
		}

		snake.unshift(newHead);
	}

	function collision(head, array) {
		for (let i = 0; i < array.length; i++) {
			if (head.x == array[i].x && head.y == array[i].y) return true;
		}
		return false;
	}

	let game = setInterval(draw, gameSpeed);
</script>
